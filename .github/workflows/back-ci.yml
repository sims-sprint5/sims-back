name: Backend CI

on:
  pull_request:
    branches:
      - develop

jobs:
  back-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create CI env file for docker-compose
        run: |
          printf '%s\n' \
            "DB_USERNAME=postgres" \
            "DB_PASSWORD=postgres" \
            "DB_DATABASE=sims_test" \
            "DB_PORT=5432" \
            "APP_ENV=testing" > .env.ci

      - name: Build and start Docker Compose (CI env)
        run: docker compose --env-file .env.ci up -d --build

      - name: Ensure bootstrap cache dir exists (in container)
        run: docker compose --env-file .env.ci run --rm api bash -lc "mkdir -p bootstrap/cache && chown -R www-data:www-data bootstrap && chmod -R 775 bootstrap/cache"

      - name: Install dependencies (in container)
        run: docker compose --env-file .env.ci run --rm api composer install --prefer-dist --no-interaction --no-progress

      - name: Generate APP_KEY and add to .env.ci
        run: |
          KEY=$(docker compose --env-file .env.ci run --rm api php artisan key:generate --show)
          echo "APP_KEY=$KEY" >> .env.ci

      - name: Run Pint (in container)
        run: docker compose --env-file .env.ci run --rm api vendor/bin/pint --test

      - name: Run migrations (in container) - retry until DB ready
        run: |
          docker compose --env-file .env.ci run --rm api bash -lc '
            for i in $(seq 1 30); do
              php artisan migrate --no-interaction && break || sleep 2;
            done
          '

      - name: Run tests (in container)
        run: docker compose --env-file .env.ci run --rm api php artisan test

      - name: Tear down Docker Compose
        if: always()
        run: docker compose --env-file .env.ci down --volumes --remove-orphans
