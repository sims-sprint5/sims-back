name: Backend CI

on:
  pull_request:
    branches:
      - develop

jobs:
  back-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create CI env file for docker-compose
        run: |
          printf '%s\n' \
            "DB_USERNAME=postgres" \
            "DB_PASSWORD=postgres" \
            "DB_DATABASE=sims_test" \
            "DB_PORT=5432" \
            "APP_ENV=testing" > .env.ci

      - name: Build Docker image
        run: docker compose --env-file .env.ci build api

      - name: Start PostgreSQL
        run: docker compose --env-file .env.ci up -d postgres

      - name: Ensure storage and cache dirs exist
        run: |
          docker compose --env-file .env.ci run --rm api bash -lc "
            mkdir -p bootstrap/cache \
              storage/logs \
              storage/framework/cache \
              storage/framework/sessions \
              storage/framework/testing \
              storage/framework/views \
            && chmod -R 775 bootstrap/cache storage
          "

      - name: Install dependencies
        run: docker compose --env-file .env.ci run --rm api composer install --prefer-dist --no-interaction --no-progress

      - name: Generate APP_KEY and add to .env.ci
        run: |
          KEY=$(docker compose --env-file .env.ci run --rm -e APP_ENV=testing api php artisan key:generate --show)
          echo "APP_KEY=$KEY" >> .env.ci

      - name: Run Pint
        run: docker compose --env-file .env.ci run --rm api vendor/bin/pint --test

      - name: Run migrations (retry until DB ready)
        run: |
          docker compose --env-file .env.ci run --rm -e APP_ENV=testing api bash -lc '
            for i in $(seq 1 30); do
              php artisan migrate --no-interaction && break || sleep 2;
            done
          '

      - name: Run tests
        run: docker compose --env-file .env.ci run --rm -e APP_ENV=testing api php artisan test

      - name: Tear down Docker Compose
        if: always()
        run: docker compose --env-file .env.ci down --volumes --remove-orphans