name: Deploy Main to Production

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up previous Docker containers
        run: docker compose --env-file .env.example down -v --remove-orphans || true

      - name: Create CI env file for docker-compose
        run: |
          RUNNER_UID=$(id -u)
          RUNNER_GID=$(id -g)
          printf '%s\n' \
            "DB_USERNAME=postgres" \
            "DB_PASSWORD=postgres" \
            "DB_DATABASE=sims_test" \
            "DB_PORT=5432" \
            "APP_ENV=testing" \
            "PGADMIN_EMAIL=ci@example.com" \
            "PGADMIN_PASSWORD=ci-password" \
            "UID=${RUNNER_UID}" \
            "GID=${RUNNER_GID}" > .env.ci

      - name: Build Docker image
        run: docker compose --env-file .env.ci build api

      - name: Start PostgreSQL
        run: docker compose --env-file .env.ci up -d postgres

      - name: Ensure storage and cache dirs exist
        run: |
          docker compose --env-file .env.ci run --rm --entrypoint "" api bash -lc "
            mkdir -p bootstrap/cache \
              storage/logs \
              storage/framework/cache \
              storage/framework/sessions \
              storage/framework/testing \
              storage/framework/views \
            && chmod -R 775 bootstrap/cache storage
          "

      - name: Install dependencies
        run: docker compose --env-file .env.ci run --rm --entrypoint "" api composer install --prefer-dist --no-interaction --no-progress

      - name: Generate APP_KEY and add to .env.ci
        run: |
          KEY=$(docker compose --env-file .env.ci run --rm --entrypoint "" -e APP_ENV=testing api php artisan key:generate --show)
          echo "APP_KEY=$KEY" >> .env.ci

      - name: Run Pint
        run: docker compose --env-file .env.ci run --rm --entrypoint "" api vendor/bin/pint --test

      - name: Run migrations (retry until DB ready)
        run: |
          docker compose --env-file .env.ci run --rm --entrypoint "" -e APP_ENV=testing api bash -lc '
            for i in $(seq 1 30); do
              php artisan migrate --no-interaction && break || sleep 2;
            done
          '

      - name: Run tests
        run: docker compose --env-file .env.ci run --rm --entrypoint "" -e APP_ENV=testing api php artisan test

      - name: Tear down Docker Compose
        if: always()
        run: docker compose --env-file .env.ci down --volumes --remove-orphans

  deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Deploy to Production Server
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${SSH_PORT:-22} -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config << EOF
          Host deploy
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: Pull latest code
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" << 'EOF'
          set -euo pipefail
          cd /var/www/sims-back
          
          # Fix ownership and permissions for git operations
          sudo chown -R $USER:$USER .git 2>/dev/null || true
          sudo chmod -R u+w .git 2>/dev/null || true
          
          # Configure git safe directory and use GitHub SSH key for fetch
          git config --global --add safe.directory /var/www/sims-back
          git config core.sshCommand "ssh -i ~/.ssh/github_deploy_repo -o StrictHostKeyChecking=no"
          
          # Verify SSH key exists and is accessible
          test -f ~/.ssh/github_deploy_repo || (echo "SSH key not found"; exit 1)
          
          # Fetch and reset to latest
          git fetch --all --prune
          git reset --hard origin/main
          EOF

      - name: Normalize production env for tenant subdomains
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" << 'EOF'
          set -euo pipefail
          cd /var/www/sims-back

          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          set_env() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
          }

          set_env_if_missing() {
            key="$1"
            value="$2"
            current="$(grep "^${key}=" .env | head -n1 | cut -d= -f2- | tr -d '\r' || true)"
            if [ -z "$current" ]; then
              set_env "$key" "$value"
            fi
          }

          app_domain="$(grep '^APP_DOMAIN=' .env | head -n1 | cut -d= -f2- | tr -d '\r' || true)"
          app_url="$(grep '^APP_URL=' .env | head -n1 | cut -d= -f2- | tr -d '\r' || true)"

          if [ -z "$app_domain" ] && [ -n "$app_url" ]; then
            app_domain="$(printf '%s' "$app_url" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##')"
          fi

          if [ -z "$app_domain" ]; then
            echo "APP_DOMAIN no está definido y no se pudo inferir desde APP_URL"
            exit 1
          fi

          set_env TENANT_BASE_DOMAIN "$app_domain"
          set_env SESSION_DOMAIN ".$app_domain"

          sanctum_domains="${app_domain},,.${app_domain}",185.13.77.175,185.13.77.175:8000
          set_env SANCTUM_STATEFUL_DOMAINS "$sanctum_domains",http://185.13.77.175,http://185.13.77.175:8000

          cors_origins="https://${app_domain}"
          set_env CORS_ALLOWED_ORIGINS "$cors_origins"

          cors_pattern="#^https?://[a-z0-9-]+[.]${app_domain//./[.]}(:[0-9]+)?\$#i"
          set_env CORS_ALLOWED_ORIGINS_PATTERNS "$cors_pattern"

          # SuperAdmin credentials (only set defaults when missing)
          set_env_if_missing SUPERADMIN_NAME "Super Admin"
          set_env_if_missing SUPERADMIN_EMAIL "superadmin@example.com"
          set_env_if_missing SUPERADMIN_PASSWORD "change_this_superadmin_password"

          # Corrige truncados/copias rotas de env anteriores
          sed -i 's/>$//' .env
          EOF

      - name: Build and start Docker containers
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /var/www/sims-back && \
             docker compose down --volumes --remove-orphans && \
             docker builder prune -af && \
             docker image prune -af && \
             docker volume prune -f && \
             docker compose build --no-cache && \
             docker compose up -d && \
             echo 'Containers started, waiting for initialization (60 seconds)...' && \
             sleep 60 && \
             echo 'Verifying containers are running...' && \
             docker compose ps"

      - name: Fix runtime permissions and APP_KEY
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" << 'EOFSETUP'
          set -euo pipefail
          cd /var/www/sims-back
          
          echo "========== DEBUG: Checking Docker state =========="
          docker compose ps
          echo ""
          
          echo "========== DEBUG: API Container logs (last 100 lines) =========="
          docker compose logs --tail=100 api || echo "No logs yet"
          echo ""
          
          # Check processes inside container
          echo "========== DEBUG: Checking Supervisor inside container =========="
          docker compose exec -T api ps aux | grep -E "supervisor|php-fpm|nginx|artisan" || echo "No supervisor/php-fpm running"
          echo ""
          
          # Wait for PHP-FPM to be ready (up to 90 seconds)
          echo "Waiting for PHP-FPM initialization (up to 90 seconds)..."
          attempt=0
          max_attempts=45
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt+1))
            
            # Try to execute a simple PHP command
            if docker compose exec -T api php -v > /dev/null 2>&1; then
              echo "✓ PHP-FPM is responding (attempt $attempt/$max_attempts)"
              break
            fi
            
            if [ $((attempt % 5)) -eq 0 ]; then
              echo "DEBUG: Attempt $attempt/$max_attempts - Container status:"
              docker compose ps api
              echo "Last lines from container:"
              docker compose logs --tail=3 api || true
            fi
            
            sleep 2
          done
          
          if [ $attempt -ge $max_attempts ]; then
            echo "❌ ERROR: PHP-FPM not responding after $max_attempts attempts (90 seconds)"
            echo "========== FINAL DEBUG: Full container logs =========="
            docker compose logs --tail=200 api
            echo ""
            echo "========== DEBUG: Docker inspect api container =========="
            docker inspect sims_api | grep -A5 State || true
            exit 1
          fi
          
          # Get UID and GID from .env or use defaults
          APP_UID=$(grep '^UID=' .env | cut -d= -f2 | tr -d '\r' || true)
          APP_GID=$(grep '^GID=' .env | cut -d= -f2 | tr -d '\r' || true)
          [ -n "$APP_UID" ] || APP_UID=33
          [ -n "$APP_GID" ] || APP_GID=33
          
          # Create storage and cache directories with proper permissions
          docker compose exec -T -u root api bash -lc "
            mkdir -p /var/www/html/storage/logs
            mkdir -p /var/www/html/storage/framework/{cache,sessions,views,testing}
            mkdir -p /var/www/html/bootstrap/cache
            touch /var/www/html/storage/logs/laravel.log
            chown -R $APP_UID:$APP_GID /var/www/html/storage /var/www/html/bootstrap/cache
            chmod -R ug+rwX /var/www/html/storage /var/www/html/bootstrap/cache
          "
          
          # Generate and set APP_KEY if not already set
          if ! grep -q '^APP_KEY=base64:' .env; then
            KEY=$(docker compose exec -T api php artisan key:generate --show)
            sed -i "s|^APP_KEY=.*|APP_KEY=$KEY|" .env
          fi
          
          # Clear caches and compile configuration
          docker compose exec -T api php artisan optimize:clear
          docker compose exec -T api php artisan cache:clear
          docker compose exec -T api php artisan route:clear
          docker compose exec -T api php artisan view:clear
          docker compose exec -T api php artisan config:cache
          EOFSETUP

      - name: Install Composer dependencies
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /var/www/sims-back && for i in \$(seq 1 5); do docker compose exec -T api composer install --prefer-dist --no-interaction && break || sleep 5; done"

      - name: Run Laravel migrations
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /var/www/sims-back && sleep 10 && for i in \$(seq 1 5); do docker compose exec -T api php artisan migrate --force && break || sleep 5; done"

      - name: Run tenant migrations for existing tenants
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" << 'EOF'
          set -euo pipefail
          cd /var/www/sims-back

          docker compose exec -T api php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();
          $tenants = Illuminate\Support\Facades\DB::table("tenants")->pluck("id");
          foreach ($tenants as $id) {
            Illuminate\Support\Facades\DB::statement("CREATE SCHEMA IF NOT EXISTS tenant_" . $id);
          }
          '

          docker compose exec -T api php artisan tenants:migrate --force
          docker compose exec -T api php artisan tenants:seed --class=RolesAndPermissionsSeeder --force
          EOF

      - name: Run Laravel seeders
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /var/www/sims-back && docker compose exec -T api php artisan db:seed --force"

      - name: Ensure SuperAdmin exists and password matches env
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /var/www/sims-back && \
             docker compose exec -T api php artisan db:seed --class=SuperAdminSeeder --force"

      - name: Restart containers
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /var/www/sims-back && docker compose restart"

      - name: Verify deployment
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /var/www/sims-back && \
             docker ps --filter label=com.docker.compose.project=sims-back && \
             docker compose exec -T api php artisan about >/dev/null || (docker compose logs --tail 200 api && exit 1)"
