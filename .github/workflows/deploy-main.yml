name: Deploy Main to Production

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create CI env file for docker-compose
        run: |
          RUNNER_UID=$(id -u)
          RUNNER_GID=$(id -g)
          printf '%s\n' \
            "DB_USERNAME=postgres" \
            "DB_PASSWORD=postgres" \
            "DB_DATABASE=sims_test" \
            "DB_PORT=5432" \
            "APP_ENV=testing" \
            "PGADMIN_EMAIL=ci@example.com" \
            "PGADMIN_PASSWORD=ci-password" \
            "UID=${RUNNER_UID}" \
            "GID=${RUNNER_GID}" > .env.ci

      - name: Build Docker image
        run: docker compose --env-file .env.ci build api

      - name: Start PostgreSQL
        run: docker compose --env-file .env.ci up -d postgres

      - name: Install dependencies
        run: docker compose --env-file .env.ci run --rm api composer install --prefer-dist --no-interaction --no-progress

      - name: Generate APP_KEY
        run: |
          KEY=$(docker compose --env-file .env.ci run --rm api php artisan key:generate --show)
          echo "APP_KEY=$KEY" >> .env.ci

      - name: Run tests
        run: docker compose --env-file .env.ci run --rm -e APP_ENV=testing api php artisan test

      - name: Tear down Docker Compose
        if: always()
        run: docker compose --env-file .env.ci down --volumes --remove-orphans


  deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Deploy to Production Server
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Pull latest code
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            git config --global --add safe.directory /var/www/sims-back &&
            cd /var/www/sims-back &&
            git pull origin main
          "

      - name: Update environment + config
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" << 'EOF'
          set -euo pipefail
          cd /var/www/sims-back

          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          set_env() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }

          set_env_if_missing() {
            key="$1"
            value="$2"
            current="$(grep "^${key}=" .env | head -n1 | cut -d= -f2- || true)"
            if [ -z "$current" ]; then
              set_env "$key" "$value"
            fi
          }

          app_domain="$(grep '^APP_DOMAIN=' .env | cut -d= -f2- || true)"

          if [ -z "$app_domain" ]; then
            echo "APP_DOMAIN no definido"
            exit 1
          fi

          set_env SESSION_DOMAIN ".$app_domain"
          set_env TENANT_BASE_DOMAIN "$app_domain"

          set_env_if_missing SUPERADMIN_EMAIL "superadmin@example.com"
          set_env_if_missing SUPERADMIN_PASSWORD "change_me"

          EOF

      - name: Deploy containers
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            cd /var/www/sims-back &&
            docker-compose down --volumes --remove-orphans &&
            docker-compose build --no-cache &&
            docker-compose up -d
          "

      - name: Run migrations
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            cd /var/www/sims-back &&
            sleep 10 &&
            docker-compose exec -T api php artisan migrate --force
          "

      - name: Clear and optimize Laravel
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            cd /var/www/sims-back &&
            docker-compose exec -T api php artisan optimize:clear &&
            docker-compose exec -T api php artisan config:cache
          "

      - name: Restart containers
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            cd /var/www/sims-back &&
            docker-compose restart
          "