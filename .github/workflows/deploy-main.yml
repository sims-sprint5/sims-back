name: Deploy Main to Production

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint & Tests

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, zip, pdo
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-dev-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-dev-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Create test .env
        run: |
          cp .env.example .env
          APP_KEY=$(php -r 'echo "base64:".base64_encode(random_bytes(32));')
          sed -i \
            -e "s|^APP_KEY=.*|APP_KEY=$APP_KEY|" \
            -e "s|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|" \
            -e "s|^DB_HOST=.*|DB_HOST=127.0.0.1|" \
            -e "s|^DB_PORT=.*|DB_PORT=5432|" \
            -e "s|^DB_USERNAME=.*|DB_USERNAME=postgres|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=postgres|" \
            -e "s|^DB_DATABASE=.*|DB_DATABASE=sims_test|" \
            .env

      - name: Verify migrations against PostgreSQL
        run: php artisan migrate --no-interaction

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Deploy to Production Server
    if: success()

    steps:
      - name: Setup SSH
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" << 'ENDDEPLOY'
          set -euo pipefail
          cd /var/www/sims-back
          export COMPOSE_FILE=docker-compose.yml

          # ── 1. Actualizar código ──────────────────────────────────────────
          git config --global --add safe.directory /var/www/sims-back
          git config core.sshCommand "ssh -i ~/.ssh/github_deploy_repo -o StrictHostKeyChecking=no"
          git fetch --all --prune
          git reset --hard origin/main

          # ── 2. Preparar .env ─────────────────────────────────────────────
          [ -f .env ] || cp .env.example .env

          set_env() {
            key="$1"; value="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
          }
          set_env_if_missing() {
            key="$1"; value="$2"
            current="$(grep "^${key}=" .env | head -n1 | cut -d= -f2- | tr -d '\r' || true)"
            [ -n "$current" ] || set_env "$key" "$value"
          }

          app_domain="$(grep '^APP_DOMAIN=' .env | head -n1 | cut -d= -f2- | tr -d '\r' || true)"
          app_url="$(grep '^APP_URL=' .env | head -n1 | cut -d= -f2- | tr -d '\r' || true)"
          [ -n "$app_domain" ] || app_domain="$(printf '%s' "$app_url" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##')"
          [ -n "$app_domain" ] || { echo "ERROR: APP_DOMAIN no definido en .env"; exit 1; }

          set_env_if_missing TENANT_BASE_DOMAIN "$app_domain"
          tenant_base_domain="$(grep '^TENANT_BASE_DOMAIN=' .env | head -n1 | cut -d= -f2- | tr -d '\r' || true)"
          [ -n "$tenant_base_domain" ] || tenant_base_domain="$app_domain"

          set_env SESSION_DOMAIN ".$tenant_base_domain"
          set_env SANCTUM_STATEFUL_DOMAINS "${app_domain},.${tenant_base_domain},185.13.77.175,185.13.77.175:8000"
          set_env CORS_ALLOWED_ORIGINS "https://${app_domain}"
          set_env CORS_ALLOWED_ORIGINS_PATTERNS "#^https?://[a-z0-9-]+[.]${tenant_base_domain//./[.]}(:[0-9]+)?\$#i"
          set_env_if_missing SUPERADMIN_NAME "Super Admin"
          set_env_if_missing SUPERADMIN_EMAIL "superadmin@example.com"
          set_env_if_missing SUPERADMIN_PASSWORD "change_this_superadmin_password"
          sed -i 's/>$//' .env

          # ── 3. Asegurar postgres en marcha (preserva datos) ───────────────
          docker compose up -d postgres

          # ── 4. Reconstruir solo la imagen api y recrear sus contenedores ──
          # postgres NO se toca: los datos se preservan entre deploys
          docker compose build api
          docker compose up -d --no-deps --force-recreate api api_web

          # ── 5. Esperar a que PHP-FPM esté listo (max 60s) ─────────────────
          echo "Esperando PHP-FPM..."
          for i in $(seq 1 30); do
            if docker compose exec -T api php -v > /dev/null 2>&1; then
              echo "✓ PHP-FPM listo (${i}x2s)"
              break
            fi
            [ "$i" -lt 30 ] || { echo "❌ PHP-FPM no responde"; docker compose logs --tail=50 api; exit 1; }
            sleep 2
          done

          # ── 6. Permisos de storage y APP_KEY ─────────────────────────────
          APP_UID="$(grep '^UID=' .env | cut -d= -f2 | tr -d '\r' || echo 33)"
          APP_GID="$(grep '^GID=' .env | cut -d= -f2 | tr -d '\r' || echo 33)"
          docker compose exec -T -u root api bash -c "
            mkdir -p /var/www/html/storage/logs \
                     /var/www/html/storage/framework/{cache,sessions,views,testing} \
                     /var/www/html/bootstrap/cache
            touch /var/www/html/storage/logs/laravel.log
            chown -R ${APP_UID}:${APP_GID} /var/www/html/storage /var/www/html/bootstrap/cache
            chmod -R ug+rwX /var/www/html/storage /var/www/html/bootstrap/cache
          " || true

          if ! grep -q '^APP_KEY=base64:' .env; then
            KEY=$(docker compose exec -T api php artisan key:generate --show)
            sed -i "s|^APP_KEY=.*|APP_KEY=$KEY|" .env
            docker compose up -d --no-deps --force-recreate api
            sleep 5
          fi

          # ── 7. Migraciones centrales ──────────────────────────────────────
          for i in $(seq 1 5); do
            docker compose exec -T api php artisan migrate --force && break || sleep 3
          done

          # ── 8. Seeders (crean SuperAdmin y tenant inicial antes de migrar) ──
          docker compose exec -T api php artisan db:seed --force

          # ── 9. Migraciones de tenant (schema se crea aquí, después del seed) ─
          docker compose exec -T api php artisan tenants:migrate --force || true

          # ── 10. Optimizar ─────────────────────────────────────────────────
          docker compose exec -T api php artisan optimize

          echo "✅ Deploy completado"
          ENDDEPLOY

      - name: Verify deployment
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /var/www/sims-back && export COMPOSE_FILE=docker-compose.yml && \
             docker compose ps && \
             docker compose exec -T api php artisan about --only=Environment \
               || { docker compose logs --tail=100 api; exit 1; }"
