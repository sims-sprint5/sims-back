services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: sims_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-sims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sims_password}
      POSTGRES_DB: ${DB_DATABASE:-sims}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sims_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: sims_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - sims_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID:-33}:${GID:-33}"
    container_name: sims_api
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sims}
      DB_USERNAME: ${DB_USERNAME:-sims_user}
      DB_PASSWORD: ${DB_PASSWORD:-sims_password}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-lvh.me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-.lvh.me}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:8000,localhost:5173,lvh.me,.lvh.me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      CORS_ALLOWED_ORIGINS_PATTERNS: ${CORS_ALLOWED_ORIGINS_PATTERNS:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
    networks:
      - sims_network

volumes:
  postgres_data:

networks:
  sims_network:
    driver: bridge
