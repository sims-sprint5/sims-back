version: '3.8'

services:
  dnsmasq:
    image: jpillora/dnsmasq
    container_name: sims_dnsmasq
    ports:
      - "53:53/udp"
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
    networks:
      - sims_network
    cap_add:
      - NET_ADMIN

  postgres:
    image: postgis/postgis:15-3.3
    container_name: sims_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-sims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sims_password}
      POSTGRES_DB: ${DB_DATABASE:-sims}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sims_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sims_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: sims_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - sims_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID}:${GID}"
    container_name: sims_api
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sims}
      DB_USERNAME: ${DB_USERNAME:-sims_user}
      DB_PASSWORD: ${DB_PASSWORD:-sims_password}
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sims_network

volumes:
  postgres_data:

networks:
  sims_network:
    driver: bridge
