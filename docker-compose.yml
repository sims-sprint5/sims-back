services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: sims_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-sims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sims_password}
      POSTGRES_DB: ${DB_DATABASE:-sims}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sims_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: sims_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - sims_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID:-33}:${GID:-33}"
    container_name: sims_api
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sims}
      DB_USERNAME: ${DB_USERNAME:-sims_user}
      DB_PASSWORD: ${DB_PASSWORD:-sims_password}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://185.13.77.175}
      APP_DOMAIN: ${APP_DOMAIN:-185.13.77.175}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-185.13.77.175.nip.io}
      FRONTEND_URL: ${FRONTEND_URL:-http://185.13.77.175}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-.185.13.77.175.nip.io}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-185.13.77.175,185.13.77.175:8000,185.13.77.175.nip.io,.185.13.77.175.nip.io}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://185.13.77.175,http://185.13.77.175:8000}
      CORS_ALLOWED_ORIGINS_PATTERNS: ${CORS_ALLOWED_ORIGINS_PATTERNS:-#^https?://[a-z0-9\-]+\.185\.13\.77\.175\.nip\.io(:\d+)?$#i}
    ports:
      - "9000:9000"
    depends_on:
      - postgres
    networks:
      - sims_network

volumes:
  postgres_data:

networks:
  sims_network:
    driver: bridge
